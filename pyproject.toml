[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "google-file-downloader"
version = "0.1.0"
description = "Reusable utility for downloading files from authenticated Google Drive folders"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.100.0",
    "google-auth>=2.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["google_file_downloader*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
