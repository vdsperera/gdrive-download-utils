[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "google-file-downloader"
version = "0.1.0"
description = "Reusable utility for downloading files from authenticated Google Drive folders"
authors = ["vdsperera <vdsperera@users.noreply.github.com>"]
repository = "https://github.com/vdsperera/gdrive-download-utils"
readme = "README.md"
keywords = ["google-drive", "download", "api"]
packages = [{include = "google_file_downloader"}]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.10"
google-api-python-client = ">=2.100.0"
google-auth = ">=2.23.0"
google-auth-oauthlib = "^1.4.0"
reportlab = "^4.5.1"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"
pytest-cov = ">=4.1.0"
black = "^24.0.0"
ruff = "^0.3.0"
mypy = "^1.8.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]