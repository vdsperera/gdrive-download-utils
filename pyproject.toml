[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "google-file-downloader"
version = "0.1.0"
description = "Reusable utility for downloading files from authenticated Google Drive folders"
packages = [{include = "google_file_downloader"}]

[tool.poetry.dependencies]
python = "^3.10"
google-api-python-client = ">=2.100.0"
google-auth = ">=2.23.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"
pytest-cov = ">=4.1.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]